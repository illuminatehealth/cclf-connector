version: 2

models:
### final
  - name: eligibility
    description: >
      Member enrollment and demographic detail, converts member months to 
      enrollment spans.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}
      tags: connector
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - member_id
            - enrollment_start_date
            - enrollment_end_date
    columns:
      - name: person_id
        tests:
          - not_null
      - name: member_id
        tests:
          - not_null
      - name: enrollment_start_date
        tests:
          - not_null:
              config:
                severity: warn
      - name: medicare_part_b_enrollment_start_date
        description: Part B enrollment start date from CCLF8 (BENE_PART_B_ENRLMT_BGN_DT).
      - name: enrollment_end_date
        tests:
          - not_null:
              config:
                severity: warn
      - name: entitlement_buy_in_indicator
        description: Monthly Medicare buy-in indicator from CCLF8 (BENE_ENTLMT_BUYIN_IND).
      - name: tuva_last_run
        description: Timestamp when dbt last built this model.

  - name: medical_claim
    description: Claim line level medical data.
    config:
      schema: |
        {%- if var('tuva_schema_prefix',None) != None -%}{{var('tuva_schema_prefix')}}_input_layer{% else %}input_layer{%- endif -%}
      tags: connector      
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - claim_id
            - claim_line_number
    columns:
      - name: claim_id
        tests:
          - not_null
      - name: claim_line_number
        tests:
          - not_null
      - name: claim_type_code
        description: Claim type code from CCLF (CLM_TYPE_CD).
      - name: person_id
        tests:
          - not_null
      - name: member_id
        tests:
          - not_null
      - name: ccn
        description: Facility CMS Certification Number (OSCAR/CCN). For institutional claims, prefers CLM_BLG_PRVDR_OSCAR_NUM (newer, 2022+) and falls back to PRVDR_OSCAR_NUM (older, pre-2022). Null for professional and DME claims.
      - name: claim_provider_specialty_code
        description: Rendering provider specialty code from professional claims (CLM_PRVDR_SPCLTY_CD). Null for institutional and DME.
      - name: operating_npi
        description: Operating provider NPI from institutional claims (OPRTG_PRVDR_NPI_NUM). Null for professional and DME.
      - name: attending_npi
        description: Attending provider NPI from institutional claims (ATNDG_PRVDR_NPI_NUM). Null for professional and DME.
      - name: other_npi
        description: Other provider NPI from institutional claims (OTHR_PRVDR_NPI_NUM). Null for professional and DME.
      - name: paid_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: allowed_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: charge_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: coinsurance_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: copayment_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: deductible_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: total_cost_amount
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                severity: warn
      - name: tuva_last_run
        description: Timestamp when dbt last built this model.

  - name: pharmacy_claim
    description: Claim line level pharmacy data.
